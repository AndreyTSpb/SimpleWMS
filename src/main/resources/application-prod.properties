# Боевой профиль: параметры БД обязательно задаются через переменные окружения
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.show-sql=false

# Только справочные данные, без демо
spring.sql.init.data-locations=optional:file:SQL/migrations/V001__seed_reference_data.sql

logging.level.root=INFO
