# Профиль разработки
spring.jpa.show-sql=true

# Справочные данные + демо-данные
spring.sql.init.data-locations=optional:file:SQL/migrations/V001__seed_reference_data.sql,optional:file:SQL/migrations/V003__drop_unused_result_table.sql,optional:file:SQL/migrations/V002__seed_demo_data.sql

logging.level.com.tynyany.simplewmsv2=DEBUG

# Ключ API для разработки и тестовых запросов (в prod задаётся только через WMS_API_KEY)
wms.api.key=${WMS_API_KEY:dev-api-key}
