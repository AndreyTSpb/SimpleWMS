# Профиль разработки
spring.jpa.show-sql=true

# Справочные данные + демо-данные
spring.sql.init.data-locations=optional:file:SQL/migrations/V001__seed_reference_data.sql,optional:file:SQL/migrations/V002__seed_demo_data.sql,optional:file:SQL/migrations/V003__drop_unused_result_table.sql,optional:file:SQL/migrations/V004__location_capacity_liters.sql

logging.level.com.tynyany.simplewmsv2=DEBUG

# Ключ API для разработки и тестовых запросов (в prod задаётся только через WMS_API_KEY)
wms.api.key=${WMS_API_KEY:dev-api-key}

# Подбор ячеек: предпочтительная зона хранения для ABC-класса товара (зоны из демо-данных V002)
wms.placement.abc-zones.A=SC1
wms.placement.abc-zones.B=SC1
wms.placement.abc-zones.C=SC2
wms.placement.abc-zones.D=SC2
