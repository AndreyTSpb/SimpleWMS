<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="'Лист размещения № ' + ${route.id()}">Лист размещения</title>
    <style>
        body { font-family: Arial, sans-serif; font-size: 11pt; margin: 20px; color: #000; }
        h1 { font-size: 16pt; margin: 0 0 6px; }
        .meta { margin-bottom: 14px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { border: 1px solid #000; padding: 4px 6px; }
        th { background: #eee; }
        td.num { text-align: right; }
        td.check { width: 60px; }
        .sign { margin-top: 30px; }
        @media print { .no-print { display: none; } }
    </style>
</head>
<body>
<p class="no-print"><button onclick="window.print()">Печать</button></p>
<h1 th:text="'Лист размещения № ' + ${route.id()}">Лист размещения № 1</h1>
<div class="meta">
    Зона хранения: <b th:text="${route.zone()}">SC1</b><br>
    Создан: <span th:text="${route.created()}">01.01.2026</span>,
    статус: <span th:text="${route.status()}">Создан</span><br>
    Исполнитель: <span th:unless="${#strings.isEmpty(route.employee())}" th:text="${route.employee()}">ФИО</span><span th:if="${#strings.isEmpty(route.employee())}">______________________</span>
</div>
<table>
    <thead>
    <tr>
        <th>№</th>
        <th>Место хранения</th>
        <th>Код</th>
        <th>Товар</th>
        <th>Партия</th>
        <th>Кол-во</th>
        <th>Размещено</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="line, st : ${route.lines()}">
        <td th:text="${st.count}">1</td>
        <td><b th:text="${line.locationCode()}">SC1-01-01-1-1</b></td>
        <td th:text="${line.productCode()}">029952</td>
        <td th:text="${line.productName()}">Товар</td>
        <td th:text="${line.batchId()}">1</td>
        <td class="num" th:text="${line.quantity()}">10</td>
        <td class="check"><span th:if="${line.complete()}">✔</span></td>
    </tr>
    </tbody>
    <tfoot>
    <tr>
        <td colspan="5"><b>Итого</b></td>
        <td class="num"><b th:text="${route.totalQuantity()}">0</b></td>
        <td></td>
    </tr>
    </tfoot>
</table>
<p class="sign">Кладовщик ______________________ / ______________________ /</p>
</body>
</html>
