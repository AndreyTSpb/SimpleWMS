spring.application.name=SimpleWMSV2

# Локальный файл .env с параметрами окружения (шаблон — .env.example)
spring.config.import=optional:file:.env[.properties]

# Профиль по умолчанию — dev; для боевого запуска SPRING_PROFILES_ACTIVE=prod
spring.profiles.default=dev

server.port=${SERVER_PORT:8080}

# Подключение к БД — через переменные окружения
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:wms}
spring.datasource.username=${DB_USER:admin}
spring.datasource.password=${DB_PASSWORD:password}
spring.datasource.driver-class-name=org.postgresql.Driver

# Схема создаётся Hibernate (см. CLAUDE.md, раздел «План и решения»)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Начальные данные выполняются после создания схемы Hibernate.
# Скрипты идемпотентны и выполняются при каждом старте.
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8

spring.jackson.serialization.indent_output=true

# Системные ячейки склада (создаются скриптом V001)
wms.locations.receiving-id=1
wms.locations.shipping-id=2

# Ключ доступа к REST API для ERP (заголовок X-API-Key); пустой — доступ по ключу отключён
wms.api.key=${WMS_API_KEY:}

# Сколько дней до окончания срока годности партия подсвечивается в отчётах как «истекает»
wms.expiry.warning-days=30

# Описание REST API (Swagger UI: /swagger-ui.html, доступ — администратор и менеджер)
springdoc.paths-to-match=/api/v1/**
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.persist-authorization=true

# Язык сообщений (в т.ч. ошибок проверки данных API) — русский, независимо от настроек браузера и ОС
spring.web.locale=ru
spring.web.locale-resolver=fixed
