spring.application.name=SimpleWMSV2

# Локальный файл .env с параметрами окружения (шаблон — .env.example)
spring.config.import=optional:file:.env[.properties]

# Профиль по умолчанию — dev; для боевого запуска SPRING_PROFILES_ACTIVE=prod
spring.profiles.default=dev

server.port=${SERVER_PORT:8080}

# Подключение к БД — через переменные окружения
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:wms}
spring.datasource.username=${DB_USER:admin}
spring.datasource.password=${DB_PASSWORD:password}
spring.datasource.driver-class-name=org.postgresql.Driver

# Схема создаётся Hibernate (см. CLAUDE.md, раздел «План и решения»)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Начальные данные выполняются после создания схемы Hibernate.
# Скрипты идемпотентны и выполняются при каждом старте.
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8

spring.jackson.serialization.indent_output=true

# Системные ячейки склада (создаются скриптом V001)
wms.locations.receiving-id=1
wms.locations.shipping-id=2
